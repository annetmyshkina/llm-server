[project]
name = "llm-server"
version = "0.1.0"
description = "My first LLM"
readme = "README.md"
authors = [
    { name = "annetmyshkina", email = "annet.obuchova@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.2.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "ollama>=0.6.2",
    "openai>=3.6.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.0",
    "sentence-transformers>=6.0.1",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
llm-server = "llm_server:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ipykernel>=7.3.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
